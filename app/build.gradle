plugins { id 'com.android.application' }
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
android {
    namespace 'app.relay.lan'
    compileSdk 35
    defaultConfig { applicationId 'app.relay.lan'; minSdk 26; targetSdk 35; versionCode 9; versionName '1.7' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    // Play Protect blocks sideloaded APKs that declare an accessibility service, so the
    // background volume-key service is only in the 'adbOnly' flavor (adb or store installs).
    flavorDimensions 'dist'
    productFlavors {
        sideload { dimension 'dist'; isDefault true }
        adbOnly { dimension 'dist' }
    }
}
